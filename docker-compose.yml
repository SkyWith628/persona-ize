# `docker compose up` 한 번으로 PostgreSQL(pgvector), Neo4j, 백엔드가 같은 환경으로 뜬다.
# 값은 .env에서 읽는다 (.env.example 참고).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-persona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-persona-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-persona_ize}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-persona} -d ${POSTGRES_DB:-persona_ize}"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j-dev-only}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-persona}:${POSTGRES_PASSWORD:-persona-dev-only}@postgres:5432/${POSTGRES_DB:-persona_ize}
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - hf-cache:/root/.cache/huggingface   # e5 모델(~470MB)을 컨테이너 재생성 뒤에도 재사용
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ---- 테스트·lint 전용 (프로필 test — `docker compose up`으로는 뜨지 않는다) ----
  # 호스트 venv를 못 쓰는 PC(Smart App Control이 .pyd를 막는 Windows 등)에서 pytest·ruff를 컨테이너로 돌린다.
  #   make test-docker / make lint-docker  (= docker compose --profile test run --rm test ...)
  #
  # 일부러 `.env`를 env_file로 넣지 않는다. 넣으면 DATABASE_URL·NEO4J_URI·ANTHROPIC_API_KEY가 환경변수로
  # 들어와 테스트가 실제 개발 DB·그래프에 붙고, 가져오기 테스트가 haiku를 실제로 부른다(비용).
  # 저장소 루트를 통째로 마운트하지 않는 것도 같은 이유다 — 루트의 .env가 보이면 Settings()가 읽는다.
  # 그래서 필요한 폴더만 읽기 전용으로 붙인다(테스트가 소스를 바꾸지 못한다).
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    image: persona-ize/backend:dev
    working_dir: /repo/backend
    environment:
      # 통합 테스트 DB. 이름이 _test로 끝나야 한다(매 실행마다 스키마를 지운다). 없으면 진입점이 만든다.
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-persona}:${POSTGRES_PASSWORD:-persona-dev-only}@postgres:5432/persona_ize_test
      LLM_PROVIDER: fake
      ANTHROPIC_API_KEY: ""
      PYTHONPATH: /repo/backend
      PYTHONUTF8: "1"
      RUFF_NO_CACHE: "true"
    volumes:
      - ./backend:/repo/backend:ro
      - ./evals:/repo/evals:ro
      - ./scripts:/repo/scripts:ro
      - ./graph:/repo/graph:ro
      - ./data:/repo/data:ro
      - ./docker:/repo/docker:ro
      - ./ruff.toml:/repo/ruff.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "/repo/docker/test/entrypoint.py"]
    command: ["pytest", "-q", "-rs", "-p", "no:cacheprovider"]

volumes:
  postgres-data:
  neo4j-data:
  hf-cache:
