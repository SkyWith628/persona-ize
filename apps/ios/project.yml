name: PersonaIze
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PERSONA_BUNDLE_ID: com.skywith628.personaize
    PERSONA_APP_GROUP: group.$(PERSONA_BUNDLE_ID)
    # 기본 서버(호스트만 — 빌드 설정 값의 // 는 주석으로 읽힐 수 있다). 비우면 로그인 화면이 주소를 묻는다.
    PERSONA_DEFAULT_SERVER_HOST: 43-203-31-7.sslip.io
targets:
  PersonaIze:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(PERSONA_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Persona_ize
        PersonaAppGroup: $(PERSONA_APP_GROUP)
        PersonaDefaultServerHost: $(PERSONA_DEFAULT_SERVER_HOST)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [$(PERSONA_APP_GROUP)]
    dependencies:
      - target: PersonaKeyboard
        embed: true
  PersonaKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(PERSONA_BUNDLE_ID).keyboard
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Persona_ize
        PersonaAppGroup: $(PERSONA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: ko-KR
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(PERSONA_APP_GROUP)]
  PersonaIzeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PERSONA_BUNDLE_ID).tests
    dependencies:
      - target: PersonaIze
schemes:
  PersonaIze:
    build:
      targets:
        PersonaIze: all
    test:
      targets: [PersonaIzeTests]
    archive:
      config: Release
