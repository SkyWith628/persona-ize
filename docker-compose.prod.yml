# 운영용 구성 — 리눅스 VM 한 대에서 Caddy(자동 HTTPS) 뒤에 백엔드·PostgreSQL·Neo4j를 띄운다.
# 따라 하는 순서는 docs/guides/deploy.md.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --wait
#   (make prod-up 과 scripts/ops/deploy.sh 가 같은 일을 한다)
#
# - 밖으로 여는 포트는 caddy의 80/443뿐이다. backend·postgres·neo4j는 호스트에 포트를 내지 않는다.
# - 값은 .env.production 에서 읽는다(.env.production.example 참고). 필수 비밀이 비어 있으면 바로 실패한다.
# - 프로젝트 이름을 고정한다. 개발 구성(docker-compose.yml, 프로젝트 persona-ize)과 같은 폴더에서 띄워도
#   컨테이너·볼륨·이미지가 섞이지 않는다.
# - 다른 env 파일을 쓰려면 `--env-file <파일>` 과 함께 환경변수 PZ_ENV_FILE=<같은 파일>을 준다
#   (앞의 것은 이 파일의 ${...} 치환용, 뒤의 것은 backend 컨테이너에 넣을 값).
name: persona-ize-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m" # 서비스당 10MB × 5개에서 순환 — 디스크가 로그로 차지 않게
    max-file: "5"

services:
  # ---- 유일한 공개 지점: HTTPS 종료, 압축, 본문 상한, 접근 로그 ----
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80" # ACME HTTP-01 확인과 https 리다이렉트
      - "${HTTPS_PORT:-443}:443"
    environment:
      # 도메인이면 Let's Encrypt 자동 발급, localhost·IP면 Caddy 내부 CA(자체 서명)
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS(서비스 도메인)가 필요합니다. 예) persona.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8000000}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # 인증서·ACME 계정. 지우면 재발급(발급 횟수 제한에 걸릴 수 있다)
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 관리 API는 컨테이너 안 localhost:2019에만 열려 있다
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
      start_interval: 2s
    # 80/443에 붙는 권한만 남긴다
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging: *logging

  # ---- 백엔드(API + 화면). 포트는 공개하지 않고 caddy만 접근한다 ----
  backend:
    image: ${BACKEND_IMAGE:-persona-ize/backend:prod}
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    env_file:
      - path: ${PZ_ENV_FILE:-.env.production}
        required: true
    environment:
      # 아래 값은 env 파일보다 우선한다. 빠뜨려도 안전한 쪽으로 떨어지게 기본값을 둔다.
      APP_ENV: ${APP_ENV:-production}
      AUTH_ALLOW_HEADER_STUB: ${AUTH_ALLOW_HEADER_STUB:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # DB·그래프 주소는 compose가 서비스 이름으로 조립한다 (env 파일에 적어도 이 값이 이긴다)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-persona}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}@postgres:5432/${POSTGRES_DB:-persona_ize}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD가 필요합니다}
      # Host 허용 목록. 따로 주지 않으면 서비스 도메인만 허용한다
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-${SITE_ADDRESS}}
      # uvicorn --proxy-headers 가 믿을 프록시. backend 포트는 호스트에 열려 있지 않아 같은 compose 네트워크의
      # 컨테이너만 닿을 수 있으므로 전부 믿는다. Caddy는 클라이언트가 보낸 X-Forwarded-For를 버리고 새로 쓴다.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      HF_HUB_OFFLINE: "1" # e5 모델은 이미지에 들어 있다
      GRAPHITI_TELEMETRY_ENABLED: "false"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pz-healthcheck"] # 이미지에 들어 있다: GET /healthz
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s # 마이그레이션 + torch·모델 로딩
      start_interval: 3s
    stop_grace_period: 30s
    # 컨테이너 안에서 쓸 수 있는 곳은 /tmp뿐이다. 파일 쓰기 오류가 나면 BACKEND_READ_ONLY=false 로 풀어 본다.
    read_only: ${BACKEND_READ_ONLY:-true}
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    networks:
      - edge
      - data
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-persona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:-persona_ize}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb # 기본 64MB는 병렬 쿼리·벡터 인덱스 생성에 모자랄 수 있다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-persona} -d ${POSTGRES_DB:-persona_ize}"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging: *logging

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      # 커뮤니티판의 초기 사용자는 neo4j 고정이다. 비밀번호는 8자 이상, 데이터 볼륨이 처음 만들어질 때만 적용된다.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD가 필요합니다}
      NEO4J_PLUGINS: '["apoc"]'
      # 작은 VM용 메모리 고정. 정하지 않으면 JVM이 호스트 메모리의 1/4을 힙으로 잡는다.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-256m}
      NEO4J_dbms_usage__report_enabled: "false" # 익명 사용 통계를 보내지 않는다
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 3s
    stop_grace_period: 120s # 체크포인트를 쓰고 내려가게 넉넉히
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NEO4J_MEM_LIMIT:-2g}
    networks:
      - data
    logging: *logging

  # ---- 주기 백업: pg_dump(커스텀 포맷) → ./backups, 보존 기간이 지난 파일 삭제 ----
  backup:
    image: pgvector/pgvector:pg16 # 서버와 같은 pg_dump 버전을 쓰려고 같은 이미지
    restart: unless-stopped
    entrypoint: ["sh", "/opt/backup/loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-persona}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}
      PGDATABASE: ${POSTGRES_DB:-persona_ize}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./docker/backup:/opt/backup:ro
    # 이 이미지는 DB 데이터 경로를 볼륨으로 선언한다. 여기서는 DB를 띄우지 않으므로 tmpfs로 덮어
    # 컨테이너를 만들 때마다 이름 없는 볼륨이 쌓이지 않게 한다.
    tmpfs:
      - /var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 최근 백업이 주기 + 2시간 안에 있으면 정상
      test: ["CMD", "sh", "/opt/backup/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 2m
      start_interval: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging: *logging

networks:
  # caddy ↔ backend. backend는 이 네트워크로 바깥(Claude API)에 나간다.
  edge:
  # backend ↔ DB. internal이라 바깥으로 나가는 길이 없다 — DB 컨테이너는 인터넷에 닿지 않는다.
  data:
    internal: true

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  caddy-data:
  caddy-config:
