<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-label="만든 데이터를 학습 세트와 시험 세트로 나눈다. 학습 세트로 GPU에서 학습한 모델과, 학습 없이 쓰는 방식이 모두 같은 시험 세트로 평가되어 하나의 비교표가 된다.">
          <style>
text{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif}
.pn{fill:#e9edf4}.bx{fill:#fff;stroke:#46536a;stroke-width:1.2}
.bx-new{fill:#f0e9ff;stroke:#6638cf;stroke-width:1.6;stroke-dasharray:5 3}
.t{fill:#172030;font-size:13px;font-weight:600}.s{fill:#566274;font-size:11px}
.hd{fill:#566274;font-size:12.5px;font-weight:600}.lb{fill:#566274;font-size:11px}
.lb-new{fill:#6638cf;font-size:11px;font-weight:500}
.ar{stroke:#46536a;stroke-width:1.3;fill:none}.ar-new{stroke:#6638cf;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
.ah{fill:#46536a}.ah-new{fill:#6638cf}
</style><rect width="980" height="280" fill="#ffffff"/><defs>
            <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
          <rect class="bx" x="20" y="110" width="170" height="60" rx="4"/>
          <text class="t" x="32" y="130">데이터 만들기</text>
          <text class="s" x="32" y="147">합성 초안과 고친 문장 쌍</text>
          <text class="s" x="32" y="161">+ 일부러 망가뜨린 쌍</text>

          <path class="ar" d="M190,125 H240 V60 H290" marker-end="url(#b)"/>
          <text class="lb" x="234" y="100" text-anchor="end">학습 세트</text>
          <rect class="bx" x="290" y="30" width="180" height="60" rx="4"/>
          <text class="t" x="302" y="50">학습 (GPU)</text>
          <text class="s" x="302" y="67">공개 한국어 모델을 우리</text>
          <text class="s" x="302" y="81">문제와 채팅 말투로 더 가르침</text>

          <rect class="bx" x="290" y="190" width="180" height="60" rx="4"/>
          <text class="t" x="302" y="210">가볍거나 학습 없는 방식</text>
          <text class="s" x="302" y="227">지금의 규칙 · 가벼운 분류기</text>
          <text class="s" x="302" y="241">공개 모델 · Claude에게 묻기</text>

          <path class="ar" d="M190,140 H570" marker-end="url(#b)"/>
          <text class="lb" x="380" y="133" text-anchor="middle">시험 세트 · 사람이 확인하고 바꾸지 않음</text>
          <path class="ar" d="M470,60 H520 V125 H570" marker-end="url(#b)"/>
          <text class="lb" x="528" y="54">학습된 모델</text>
          <path class="ar" d="M470,220 H520 V155 H570" marker-end="url(#b)"/>

          <rect class="bx" x="570" y="110" width="170" height="60" rx="4"/>
          <text class="t" x="582" y="130">평가</text>
          <text class="s" x="582" y="147">모든 방식이 같은 문제를</text>
          <text class="s" x="582" y="161">같은 채점으로 풂</text>

          <path class="ar" d="M740,140 H790" marker-end="url(#b)"/>
          <rect class="bx" x="790" y="110" width="170" height="60" rx="4"/>
          <text class="t" x="802" y="130">비교표</text>
          <text class="s" x="802" y="147">방식 일곱 줄 ·</text>
          <text class="s" x="802" y="161">정확도 · 지연 · 비용</text>
        </svg>
