<text x="410.0" y="282.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400">1</text>
<line x1="530.0" y1="116" x2="530.0" y2="264" stroke="#e1e0d9"/>
<text x="530.0" y="282.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400">1.5</text>
<line x1="650.0" y1="116" x2="650.0" y2="264" stroke="#e1e0d9"/>
<text x="650.0" y="282.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400">2</text>
<line x1="770.0" y1="116" x2="770.0" y2="264" stroke="#e1e0d9"/>
<text x="770.0" y="282.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400">2.5</text>
<text x="158.0" y="141.5" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="700">지금</text>
<path d="M170,122 H382.0 Q386.0,122 386.0,126 V148 Q386.0,152 382.0,152 H170 Z" fill="#2a78d6"/>
<text x="396.0" y="141.5" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="400">0.9GB</text>
<text x="158.0" y="191.5" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="700">base를 올리면</text>
<path d="M170,172 H386.0 Q386.0,172 386.0,172 V202 Q386.0,202 386.0,202 H170 Z" fill="#2a78d6"/>
<path d="M388.0,172 H499.6 Q503.6,172 503.6,176 V198 Q503.6,202 499.6,202 H388.0 Z" fill="#eb6834"/>
<text x="513.6" y="191.5" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="400">약 1.4GB · 들어간다</text>
<text x="158.0" y="241.5" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="700">large를 올리면</text>
<path d="M170,222 H386.0 Q386.0,222 386.0,222 V252 Q386.0,252 386.0,252 H170 Z" fill="#2a78d6"/>
<path d="M388.0,222 H689.2 Q693.2,222 693.2,226 V248 Q693.2,252 689.2,252 H388.0 Z" fill="#eb6834"/>
<text x="703.2" y="241.5" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="700">약 2.2GB · 상한을 넘는다</text>
<line x1="650.0" y1="108" x2="650.0" y2="264" stroke="#52514e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="650.0" y="102.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">컨테이너 상한 2GB</text>
<text x="170.0" y="306.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">판정 모델의 양은 가중치 크기만 더한 것이다(base는 큰 쪽인 KcELECTRA 0.49GB). 서버 전체는 4GB이고 Neo4j가 약 1GB를 따로 쓴다.</text>
