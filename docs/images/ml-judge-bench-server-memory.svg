<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
<rect width="960" height="330" fill="#fcfcfb"/>
<text x="32.0" y="38.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">운영 서버의 백엔드 컨테이너 메모리</text>
<text x="32.0" y="60.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">백엔드 컨테이너의 상한은 2GB다. base는 들어가고 large는 넘는다. 단위 GB.</text>
<rect x="170" y="82" width="12" height="12" rx="3" fill="#2a78d6"/>
<text x="188.0" y="92.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">지금 쓰는 양 (앱 + e5 임베딩 모델)</text>
<rect x="388.6" y="82" width="12" height="12" rx="3" fill="#eb6834"/>
<text x="406.6" y="92.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">판정 모델</text>
<line x1="170.0" y1="116" x2="170.0" y2="264" stroke="#c3c2b7"/>
<text x="170.0" y="282.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400">0</text>
<line x1="290.0" y1="116" x2="290.0" y2="264" stroke="#e1e0d9"/>
<text x="290.0" y="282.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400">0.5</text>
