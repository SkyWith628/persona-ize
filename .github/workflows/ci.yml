name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint (저장소 전체, ruff.toml)
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        working-directory: backend
        run: pytest -q
      - name: Eval smoke (fake provider)
        run: python evals/run_eval.py --cases evals/eval_cases.csv --conditions A,B --out /tmp/eval.csv

  data-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSV/JSON 접점 파일
        run: python scripts/validate_data_files.py
