name: iPhone build
on:
  push:
    branches: [design/iphone-mobile]
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and keyboard for Simulator
        run: |
          xcodebuild -version
          xcodebuild -project PersonaIze.xcodeproj -scheme PersonaIze -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/build" build
      - name: Launch on iPhone and capture the interface
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app="$RUNNER_TEMP/build/Build/Products/Debug-iphonesimulator/PersonaIze.app"
          test -d "$app/PlugIns/PersonaKeyboard.appex"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.skywith628.personaize
          sleep 4
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/iphone.png"
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-interface
          path: ${{ runner.temp }}/iphone.png
      - name: Verify unsigned device archive
        run: |
          xcodebuild -project PersonaIze.xcodeproj -scheme PersonaIze -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PersonaIze.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          test -d "$RUNNER_TEMP/PersonaIze.xcarchive/Products/Applications/PersonaIze.app/PlugIns/PersonaKeyboard.appex"
