[project]
name = "persona-ize-backend"
version = "0.1.0"
description = "상대·상황에 맞는 사용자 말투로 메시지를 첨삭하되 원문의 사실과 의도를 보존하는 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "anthropic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# PostgreSQL + pgvector 저장소 (torch 없음 — CI가 이 extra로 통합 테스트를 돌린다)
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
]
# 로컬 임베딩 e5-small (torch를 끌어와 크다). 실제 C/D 검색과 Docker 이미지에 필요
embed = [
    "sentence-transformers>=3.0",
]
# 3주차: Graphiti 기반 D 경로 (graph/graphiti_p0 스파이크와 같은 버전)
graph = [
    "graphiti-core[anthropic]==0.31.2",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

# ruff 설정은 저장소 루트 ruff.toml 하나로 통일한다.
