# Alembic config. ASCII only: alembic reads this file with the locale encoding (cp949 on Korean Windows).
# The connection string is not stored here; migrations/env.py reads DATABASE_URL from .env.
# Run from backend/: ../.venv/Scripts/python.exe -m alembic upgrade head   (or `make migrate` at repo root)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
